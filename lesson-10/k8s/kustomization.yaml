apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - redis-statefulset.yaml
  - redis-service.yaml
  - ingress.yaml
  - ingress-tls.yaml

secretGenerator:
  - name: course-app-tls
    type: kubernetes.io/tls
    files:
      - tls.crt
      - tls.key